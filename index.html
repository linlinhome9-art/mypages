<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q版小天地</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Arial", "Microsoft JhengHei", sans-serif;
      background: #fff4f8;
      color: #5b4650;
    }

    /* 導覽列 */
    nav {
      height: 65px;
      background: #ffb6c9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    nav .logo {
      font-size: 24px;
      font-weight: bold;
      color: white;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    /* 主區域 */
    .hero {
      min-height: calc(100vh - 65px);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 70px;
      padding: 50px 20px;
    }

    .text {
      max-width: 450px;
    }

    .text h1 {
      font-size: 52px;
      margin: 0 0 15px;
      color: #ff7096;
    }

    .text p {
      font-size: 20px;
      line-height: 1.8;
    }

    .btn {
      border: none;
      background: #ff7096;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 0 #df5478;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #df5478;
    }

    /* Q版角色 */
    .character {
      width: 280px;
      height: 280px;
      background: #ffe0e8;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 12px 25px rgba(255,112,150,0.25);
      animation: float 3s ease-in-out infinite;
    }

    /* 耳朵 */
    .ear {
      width: 80px;
      height: 100px;
      background: #ffd1df;
      border-radius: 50%;
      position: absolute;
      top: -35px;
    }

    .ear.left {
      left: 35px;
      transform: rotate(-25deg);
    }

    .ear.right {
      right: 35px;
      transform: rotate(25deg);
    }

    /* 眼睛 */
    .eye {
      width: 28px;
      height: 38px;
      background: #59434a;
      border-radius: 50%;
      position: absolute;
      top: 105px;
    }

    .eye::after {
      content: "";
      width: 8px;
      height: 10px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 6px;
      left: 6px;
    }

    .eye.left {
      left: 75px;
    }

    .eye.right {
      right: 75px;
    }

    /* 腮紅 */
    .cheek {
      width: 40px;
      height: 20px;
      background: #ff9db5;
      border-radius: 50%;
      position: absolute;
      top: 155px;
    }

    .cheek.left {
      left: 35px;
    }

    .cheek.right {
      right: 35px;
    }

    /* 嘴巴 */
    .mouth {
      width: 25px;
      height: 15px;
      border-bottom: 5px solid #59434a;
      border-radius: 50%;
      position: absolute;
      top: 160px;
      left: 128px;
    }

    /* 飄動 */
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    /* 手機版 */
    @media (max-width: 700px) {
      nav {
        padding: 0 20px;
      }

      nav a {
        display: none;
      }

      .hero {
        flex-direction: column-reverse;
        gap: 30px;
        text-align: center;
      }

      .text h1 {
        font-size: 40px;
      }

      .character {
        width: 220px;
        height: 220px;
      }

      .eye {
        top: 85px;
      }

      .eye.left {
        left: 55px;
      }

      .eye.right {
        right: 55px;
      }

      .cheek {
        top: 130px;
      }

      .cheek.left {
        left: 25px;
      }

      .cheek.right {
        right: 25px;
      }

      .mouth {
        top: 135px;
        left: 98px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">🐰 Q版小天地</div>

    <div>
      <a href="#">首頁</a>
      <a href="#">關於我</a>
      <a href="#">聯絡</a>
    </div>
  </nav>

  <main class="hero">

    <div class="text">
      <h1>嗨！你好 ♡</h1>

      <p>
        歡迎來到我的 Q 版小天地！<br>
        這是一個用 HTML、CSS 和 JavaScript
        做出來的可愛小網站。
      </p>

      <button class="btn" onclick="sayHello()">
        點我一下 ✨
      </button>
    </div>

    <div class="character">
      <div class="ear left"></div>
      <div class="ear right"></div>

      <div class="eye left"></div>
      <div class="eye right"></div>

      <div class="cheek left"></div>
      <div class="cheek right"></div>

      <div class="mouth"></div>
    </div>

  </main>

  <script>
    function sayHello() {
      alert("嗨嗨！🐰 很高興見到你！");
    }
  </script>

</body>
</html>
