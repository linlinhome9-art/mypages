<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Q版小天地</title>

  <!-- 連接 CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <div class="logo">🐰 Q版小天地</div>

    <div>
      <a href="#">首頁</a>
      <a href="#">關於我</a>
      <a href="#">聯絡</a>
    </div>
  </nav>

  <main class="hero">

    <div class="text">
      <h1>嗨！你好 ♡</h1>

      <p>
        歡迎來到我的 Q 版小天地！<br>
        這裡是一個溫暖又可愛的小空間。
      </p>

      <button class="btn" onclick="sayHello()">
        點我一下 ✨
      </button>
    </div>

    <div class="character">

      <div class="ear left"></div>
      <div class="ear right"></div>

      <div class="eye left"></div>
      <div class="eye right"></div>

      <div class="cheek left"></div>
      <div class="cheek right"></div>

      <div class="mouth"></div>

    </div>

  </main>

  <!-- 連接 JavaScript -->
  <script src="script.js"></script>

</body>
</html>
